name: Update China IP data

on:
  schedule:
    # APNIC republishes the delegation file daily; monthly is frequent enough
    # for national allocations and keeps the diff noise down.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - run: ./script/update-chinaip.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-chinaip
          title: "Update China IP data from APNIC"
          commit-message: "Update China IP data from APNIC"
          body: |
            Regenerated `chinaip_data.go` from the APNIC delegation statistics.

            The routing tests ran as part of the regeneration, so a truncated
            or scrambled download will have failed the job rather than landed
            here.
          delete-branch: true
